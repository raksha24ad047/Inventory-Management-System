<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Inventory Management System</h1>
    
    <div id="app">
        <section>
            <h2>Products</h2>
            <input id="pName" placeholder="Name">
            <input id="pPrice" placeholder="Price">
            <button onclick="addProduct()">Add Product</button>
            <table id="productTable"><thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead><tbody id="pBody"></tbody></table>
        </section>

        <section>
            <h2>Stock Management (Trigger Simulation)</h2>
            <input id="sQty" type="number" placeholder="Stock Quantity">
            <button onclick="addStock()">Add Stock</button>
            <button onclick="generateStockReport()">Generate Stock Report (Stored Proc)</button>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Inventory Management System</h1>
    
    <div id="app">
        <section>
            <h2>Products</h2>
            <input id="pName" placeholder="Name">
            <input id="pPrice" placeholder="Price">
            <button onclick="addProduct()">Add Product</button>
            <table id="productTable"><thead><tr><th>Name</th><th>Price</th><th>Action</th></tr></thead><tbody id="pBody"></tbody></table>
        </section>

        <section>
            <h2>Stock Management (Trigger Simulation)</h2>
            <input id="sQty" type="number" placeholder="Stock Quantity">
            <button onclick="addStock()">Add Stock</button>
            <button onclick="generateStockReport()">Generate Stock Report (Stored Proc)</button>
        </section>
    </div>
    <section>
    <h2>Inventory Stock Report</h2>
    <div id="reportContainer" style="border:1px solid #ccc; padding: 10px; background: #f9f9f9;">
        <em>Click the button below to view the report...</em>
    </div>
    <button onclick="generateStockReport()">Refresh Report</button>
</section>

<div id="updateForm" style="display:none;">
    <h3>Update Product</h3>
    <input type="hidden" id="editIndex">
    <input id="editName" placeholder="New Name">
    <button onclick="saveUpdate()">Save Changes</button>
</div>
    <script src="script.js"></script>
</body>
</html>

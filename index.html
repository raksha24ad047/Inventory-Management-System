<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Inventory Management System</h1>

<div class="cards">
    <div class="card">
        <h2>Products</h2>
        <p>4 Products Available</p>
    </div>

    <div class="card">
        <h2>Suppliers</h2>
        <p>3 Suppliers Registered</p>
    </div>

    <div class="card">
        <h2>Warehouses</h2>
        <p>3 Warehouses</p>
    </div>
</div>

<div class="buttons">
    <button onclick="showProducts()">Products</button>
    <button onclick="showSuppliers()">Suppliers</button>
    <button onclick="showWarehouse()">Warehouse</button>
</div>
<h2>Add Product</h2>

<input type="text" id="productName" placeholder="Product Name">

<input type="number" id="productPrice" placeholder="Price">

<button onclick="addProduct()">
Add Product
</button>
<div id="output"></div>

<script src="script.js"></script>

</body>
</html>
